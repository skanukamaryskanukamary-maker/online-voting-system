<!DOCTYPE html>
<html>

<head>
    <title>Edit Candidate</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

<h1>Edit Candidate</h1>

<form method="POST">

<input type="text"
       name="name"
       value="{{ candidate[1] }}"
       required>

<br><br>

<input type="text"
       name="party"
       value="{{ candidate[2] }}"
       required>

<br><br>

<input type="text"
       name="symbol"
       value="{{ candidate[3] }}"
       required>

<br><br>

<button type="submit">
Update Candidate
</button>

</form>

<br>

<a href="/manage_candidates">
<button>Back</button>
</a>

</div>

</body>
</html>
